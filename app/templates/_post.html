<table class="table table-hover">
  <tr>
    <td width="70px">
      <img src="{{ post.author.avatar(36) }}" alt="User's avatar" />
    </td>
    <td>
      <a href="{{ url_for('user', username=post.author.username) }}">
        {{ post.author.username }}
      </a> says: <br> {{ post.body }}
    </td>
  </tr>
</table>
